{% extends 'base.html' %}

{% block title %}
Join Attendance
{% endblock %}

{% block content %}

<div class="container mt-4">

<div class="card shadow">

<div class="card-body">

<h2 class="text-center mb-4">
Join Attendance Session
</h2>

<div class="text-center">

<video
id="video"
width="500"
height="350"
autoplay
playsinline
muted
class="border rounded">
</video>

<canvas id="canvas" style="display:none;"></canvas>

</div>

<form method="POST" id="attendanceForm">

<input type="hidden" name="image" id="imageInput">
<input type="hidden" name="latitude" id="latitude">
<input type="hidden" name="longitude" id="longitude">

<div class="row mt-4">

<div class="col-md-6">
<button type="button" id="captureBtn" class="btn btn-primary w-100">
Capture Photo
</button>
</div>

<div class="col-md-6">
<button type="submit" class="btn btn-success w-100">
Submit Attendance
</button>
</div>

</div>

</form>

<div class="mt-3 text-center" id="status"></div>

</div>
</div>

</div>

<script>

document.addEventListener("DOMContentLoaded", function () {

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const imageInput = document.getElementById("imageInput");
const status = document.getElementById("status");

let streamStarted = false;

/* ================= CAMERA START ================= */
navigator.mediaDevices.getUserMedia({ video: true })
.then(function(stream) {
    video.srcObject = stream;
    streamStarted = true;
})
.catch(function(err) {
    console.log(err);
    status.innerHTML = `
        <div class="alert alert-danger">
            Camera error: ${err.message}
        </div>
    `;
});

/* ================= GEOLOCATION ================= */
navigator.geolocation.getCurrentPosition(
function(position) {
    document.getElementById("latitude").value = position.coords.latitude;
    document.getElementById("longitude").value = position.coords.longitude;
},
function() {
    status.innerHTML = `
        <div class="alert alert-warning">
            Location unavailable
        </div>
    `;
});

/* ================= CAPTURE PHOTO ================= */
document.getElementById("captureBtn").addEventListener("click", function () {

if (!streamStarted) {
    status.innerHTML = `
        <div class="alert alert-danger">
            Camera not started
        </div>
    `;
    return;
}

canvas.width = 640;
canvas.height = 480;

const ctx = canvas.getContext("2d");  // ✅ ONLY ONCE

ctx.drawImage(video, 0, 0, 640, 480);

// compress image to avoid payload error
let imageData = canvas.toDataURL("image/jpeg", 0.6);

imageInput.value = imageData;

status.innerHTML = `
    <div class="alert alert-success">
        Photo captured successfully
    </div>
`;
});

/* ================= FORM VALIDATION ================= */
document.getElementById("attendanceForm").addEventListener("submit", function(e) {

if (imageInput.value === "") {
    e.preventDefault();

    status.innerHTML = `
        <div class="alert alert-danger">
            Capture photo before submitting
        </div>
    `;
}

});

});

</script>

{% endblock %}
