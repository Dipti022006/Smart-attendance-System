{% extends 'base.html' %}

{% block content %}

<div class="auth-container">

    <div class="card p-4">

        <h3 class="text-center mb-3">Student Login</h3>

        <form method="POST">

            <input class="form-control mb-3"
                   name="email"
                   placeholder="Email">

            <input class="form-control mb-3"
                   name="password"
                   type="password"
                   placeholder="Password">

            <button class="btn btn-primary btn-block">
                Login
            </button>

        </form>

    </div>
</div>

{% endblock %}
