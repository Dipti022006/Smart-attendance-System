{% extends 'base.html' %}

{% block title %}
Student Register
{% endblock %}

{% block content %}

<div class="container">

    <div class="row justify-content-center">

        <div class="col-lg-5">

            <div class="card custom-card">

                <div class="card-body p-5">

                    <div class="text-center mb-4">

                        <i class="bi bi-mortarboard-fill
                                  display-4 text-primary"></i>

                        <h2 class="fw-bold mt-3">
                            Student Registration
                        </h2>
                        <p class="text-center">
                            Register yourself using live face capture for smart attendance.
                        </p>

                        <i class="bi bi-camera-video-fill display-1 mt-3"></i>


                    </div>

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">
                                Full Name
                            </label>

                            <input type="text"
                                   name="username"
                                   class="form-control"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input type="email"
                                   name="email"
                                   class="form-control"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Academic Year
                            </label>

                            <select name="year"
                                    class="form-control"
                                    required>

                                <option value="">
                                    Select Year
                                </option>

                                <option value="First Year">
                                    First Year
                                </option>

                                <option value="Second Year">
                                    Second Year
                                </option>

                                <option value="Third Year">
                                    Third Year
                                </option>

                                <option value="Final Year">
                                    Final Year
                                </option>

                            </select>

                        </div>
                        <div class="mb-3">
    <label>Branch</label>
    <select name="branch" class="form-control" required>
        <option>Computer Science</option>
        <option>IT</option>
        <option>ENTC</option>
        <option>Mechanical</option>
        <option>Civil</option>
    </select>
</div>
<div class="mb-3">
    <label>Division</label>
    <select name="division" class="form-control" required>
        <option>A</option>
        <option>B</option>
        <option>C</option>
        <option>D</option>
        <option>E</option>
        <option>F</option>
        <option>G</option>
        <option>H</option>
        <option>I</option>
        <option>J</option>
        <option>K</option>
        <option>L</option>
        <option>M</option>
        <option>N</option>
        <option>O</option>
        <option>P</option>
        <option>Q</option>
        <option>R</option>
        <option>S</option>
        <option>T</option>
        <option>U</option>
        <option>V</option>
        <option>W</option>
        <option>X</option>
        <option>Y</option>
        <option>Z</option>
    </select>
</div>


                        <div class="mb-4">

                            <label class="form-label">
                                Password
                            </label>

                            <input type="password"
                                   name="password"
                                   class="form-control"
                                   required>

                        </div>
                        <div class="text-center mb-3">

                                <video id="video"
                                       width="100%"
                                       height="300"
                                       autoplay
                                       class="rounded-4 border shadow-sm">
                                </video>

                            </div>
                            <!-- HIDDEN IMAGE FIELD -->

                            <input type="hidden"
                                   name="captured_image"
                                   id="captured_image">

                            <!-- PREVIEW -->

                            <div class="text-center mb-3">

                                <canvas id="canvas"
                                        width="400"
                                        height="300"
                                        class="d-none border rounded-4">
                                </canvas>

                                <img id="preview"
                                     class="img-fluid rounded-4 shadow-sm d-none">

                            </div>
                            <!-- BUTTONS -->

                            <div class="d-grid gap-2">

                                <button type="button"
                                        id="capture"
                                        class="btn btn-dark btn-lg rounded-3">

                                    <i class="bi bi-camera-fill"></i>
                                    Capture Photo

                                </button>


                        <button type="submit"
                                class="btn btn-custom w-100">

                            Register Student

                        </button>

                    </form>

                    <p class="text-center mt-4">

                        Already have an account?

                        <a href="/student_login">
                            Login
                        </a>

                    </p>

                </div>

            </div>

        </div>

    </div>

</div>
<script src="{{ url_for('static', filename='student.js') }}"></script>

{% endblock %}
