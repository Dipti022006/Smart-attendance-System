{% extends 'base.html' %}

{% block title %}
Teacher Register
{% endblock %}

{% block content %}

<div class="container">

    <div class="row justify-content-center">

        <div class="col-lg-5">

            <div class="card custom-card">

                <div class="card-body p-5">

                    <div class="text-center mb-4">

                        <i class="bi bi-person-workspace
                                  display-4 text-dark"></i>

                        <h2 class="fw-bold mt-3">
                            Teacher Registration
                        </h2>

                    </div>

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">
                                Full Name
                            </label>

                            <input type="text"
                                   name="username"
                                   class="form-control"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input type="email"
                                   name="email"
                                   class="form-control"
                                   required>

                        </div>

                        <div class="mb-4">

                            <label class="form-label">
                                Password
                            </label>

                            <input type="password"
                                   name="password"
                                   class="form-control"
                                   required>

                        </div>

                        <button type="submit"
                                class="btn btn-dark w-100">

                            Register Teacher

                        </button>

                    </form>

                    <p class="text-center mt-4">

                        Already have an account?

                        <a href="/teacher_login">
                            Login
                        </a>

                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
