{% extends 'base.html' %}

{% block title %}
Upload Schedule
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow-lg border-0">

        <div class="card-body">

            <h2 class="text-center mb-4">

                Upload CSV Timetable

            </h2>

            <form method="POST"
                  enctype="multipart/form-data">

                <div class="mb-3">

                    <label class="form-label">

                        Select CSV File

                    </label>

                    <input type="file"
                           name="file"
                           class="form-control"
                           accept=".csv"
                           required>

                </div>

                <button class="btn btn-dark w-100">

                    Upload Schedule

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
